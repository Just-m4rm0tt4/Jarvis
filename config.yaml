# JARVIS-6 — configurazione locale italiana per Windows 11
audio:
  input_device: null     # microfono predefinito di Windows
  sample_rate: 16000
  frame_ms: 20
  vad_aggressiveness: 2       # WebRTC fallback
  vad_threshold: 0.5          # Silero VAD speech probability (CPU / ONNX)
  silence_ms_to_endpoint: 550

wakeword:
  enabled: true
  always_on: true
  model: "hey_jarvis"
  custom_model_path: null
  threshold: 0.5
  vad_gate: 0.3
  follow_up_seconds: 8
  manual_button: true
  clap_to_wake: true
  clap_min_gap_ms: 120
  clap_max_gap_ms: 700
  clap_cooldown_ms: 1200

speaker_id:
  enabled: true
  owner_name: "Edoardo"
  voiceprint_path: data/voiceprint.json
  threshold: 0.75
  privileged_threshold: 0.82
  enroll_clips: 8

stt:
  engine: faster-whisper
  model: small
  device: cpu
  compute_type: int8
  language: it
  first_partial_routing: true

llm:
  backend: ollama
  base_url: http://127.0.0.1:11434
  model: qwen3:4b
  vision_model: qwen3-vl:4b
  temperature: 0.4
  max_output_tokens: 1024
  timeout_seconds: 180
  num_ctx: 4096
  num_gpu_layers: 999
  think: false
  keep_alive: 90s
  vision_keep_alive: 0

tts:
  engine: kokoro
  voice: if_sara
  speed: 1.0
  language: it
  model_path: models/kokoro-v1.0.onnx
  voices_path: models/voices-v1.0.bin
  sentence_streaming: true

memory:
  core_blocks_path: data/core_memory.json
  recall_path: data/recall.sqlite3
  archival_top_k: 4

tools:
  desktop_automation: true
  filesystem: true
  web_search: true
  home_assistant:
    enabled: false
    base_url: http://homeassistant.local:8123
    token_env: HA_TOKEN
  snapcast:
    enabled: false
    host: 127.0.0.1
  browser:
    enabled: true
    headless: false
    channel: null
    timeout_ms: 15000
  vision:
    enabled: true
    model: qwen3-vl:4b
    screenshot_path: data/screen.png

safety:
  owner_only:
    - system.power
    - system.kill
    - files.move
    - files.find
    - files.open
    - files.recent
    - fs.list
    - fs.read
    - fs.write
    - desktop.run_command
    - desktop.type_text
    - desktop.hotkey
    - desktop.click
    - desktop.screenshot
    - memory.core_replace
    - memory.core_append
    - memory.archival_search
    - memory.recall_search
  confirm_before:
    - system.power
    - system.kill
    - fs.delete
    - desktop.run_command
    - homeassistant.call_service

compute:
  cpu: [silero_vad, wakeword_cnn, kokoro_tts, speaker_encoder, browser, faster_whisper_int8]
  gpu: [ollama_qwen3, ollama_qwen3_vl]
  reserved_vram_gb: 2.0

audit:
  enabled: true
  path: data/audit.jsonl
  max_api_records: 500

metrics:
  log_path: data/metrics.jsonl
  vram_ceiling_gb: 8.0
  sample_seconds: 5

rag:
  enabled: true
  db_path: data/rag.sqlite3
  index_on_start: false
  top_k: 5
  max_file_mb: 2
  roots:
    - "%USERPROFILE%/Documents"
    - "%USERPROFILE%/Desktop"

proactive:
  enabled: true
  jobs_path: data/jobs.json
  routines:
    "08:15": "Buongiorno. Quando vuoi, chiedimi il riepilogo della giornata."
    "23:30": "Sono le undici e mezza. Vuoi che prepari lo spegnimento del computer?"

learning:
  enabled: true
  sft_path: data/live_sft.jsonl
  dpo_path: data/live_dpo.jsonl
  min_pairs_before_retrain: 200

server:
  host: 127.0.0.1
  port: 8765
